<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Edit Fee Invoice')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('fees')}"></div>

    <main class="app-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Breadcrumb / Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/accountant/fees}">Fee Management</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Edit Invoice</li>
                    </ol>
                </nav>
                <h3 class="fw-bold mb-0">Modify Fee Invoice #<span th:text="${feeId}">1</span></h3>
            </div>
            <a th:href="@{/accountant/fees}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Back to Invoices
            </a>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted small">Student:</span>
                                <h6 class="fw-bold mb-0" th:text="${studentName + ' (' + admissionNumber + ')'}">Rahul Sharma (ADM-001)</h6>
                            </div>
                            <span class="badge bg-secondary" th:text="${month}">OCTOBER-2026</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/accountant/fees/update/{id}(id=${feeId})}" th:object="${fee}" method="post">
                            
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="dueDate" class="form-label fw-semibold">Payment Due Date <span class="text-danger">*</span></label>
                                    <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control"
                                           th:classappend="${#fields.hasErrors('dueDate')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Current Paid Amount</label>
                                    <input type="text" class="form-control" readonly th:value="'₹' + ${#numbers.formatDecimal(paidAmount, 1, 'COMMA', 2, 'POINT')}">
                                    <small class="text-muted">Already cleared via transactions</small>
                                </div>
                            </div>

                            <h6 class="fw-bold border-bottom pb-2 mt-4 mb-3 text-primary">Fee Breakdown Components</h6>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="roomRent" class="form-label fw-semibold">Room Rent (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" id="roomRent" th:field="*{roomRent}" class="form-control fee-input"
                                           th:classappend="${#fields.hasErrors('roomRent')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('roomRent')}" th:errors="*{roomRent}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="messFee" class="form-label fw-semibold">Mess Fee (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" id="messFee" th:field="*{messFee}" class="form-control fee-input"
                                           th:classappend="${#fields.hasErrors('messFee')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('messFee')}" th:errors="*{messFee}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="electricityFee" class="form-label fw-semibold">Electricity Fee (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" id="electricityFee" th:field="*{electricityFee}" class="form-control fee-input"
                                           th:classappend="${#fields.hasErrors('electricityFee')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('electricityFee')}" th:errors="*{electricityFee}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="maintenanceFee" class="form-label fw-semibold">Maintenance Fee (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" id="maintenanceFee" th:field="*{maintenanceFee}" class="form-control fee-input"
                                           th:classappend="${#fields.hasErrors('maintenanceFee')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('maintenanceFee')}" th:errors="*{maintenanceFee}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="remarks" class="form-label fw-semibold">Remarks / Notes</label>
                                <textarea id="remarks" th:field="*{remarks}" class="form-control" rows="2" placeholder="Adjustment notes..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/accountant/fees}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i> Update Invoice
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Summary / Computation Side -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4 bg-light">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3 text-secondary">REVISED TOTAL AMOUNT</h6>
                        <div class="display-6 fw-bold text-primary mb-2" id="totalPreview">₹0.00</div>
                        <p class="text-muted small">Pending balance will automatically recalculate: (New Total - ₹<span th:text="${paidAmount}">0</span> paid).</p>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>

<script>
    function recalculateTotal() {
        const rent = parseFloat(document.getElementById('roomRent').value) || 0;
        const mess = parseFloat(document.getElementById('messFee').value) || 0;
        const elec = parseFloat(document.getElementById('electricityFee').value) || 0;
        const maint = parseFloat(document.getElementById('maintenanceFee').value) || 0;
        const total = rent + mess + elec + maint;
        document.getElementById('totalPreview').innerText = '₹' + total.toFixed(2);
    }

    document.querySelectorAll('.fee-input').forEach(input => {
        input.addEventListener('input', recalculateTotal);
    });
    window.addEventListener('DOMContentLoaded', recalculateTotal);
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
