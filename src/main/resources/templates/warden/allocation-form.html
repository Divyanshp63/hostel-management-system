<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Direct Room Allocation')}">
    <title>Allocate Room - Smart PG &amp; Hostel</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('allocations')}"></div>

    <main class="app-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Direct Room Allocation</h3>
                <p class="text-muted small mb-0">Assign an available bed directly to an enrolled student</p>
            </div>
            <a th:href="@{/warden/allocations}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Allocations
            </a>
        </div>

        <div class="card card-custom">
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/warden/allocations/save}" th:object="${allocation}" method="post">
                    <div class="row g-3 mb-4">
                        <!-- Student Select -->
                        <div class="col-md-6">
                            <label for="studentId" class="form-label">Select Student <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{studentId}" id="studentId" th:classappend="${#fields.hasErrors('studentId')} ? 'is-invalid' : ''">
                                <option value="">-- Choose Student --</option>
                                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.user.name} + ' (' + ${s.admissionNumber} + ' - ' + ${s.course} + ')'">Rahul (ADM-001)</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{studentId}"></div>
                        </div>

                        <!-- Room Select -->
                        <div class="col-md-6">
                            <label for="roomId" class="form-label">Select Available Room <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{roomId}" id="roomId" th:classappend="${#fields.hasErrors('roomId')} ? 'is-invalid' : ''">
                                <option value="">-- Choose Available Room --</option>
                                <option th:each="r : ${rooms}" th:value="${r.id}" th:text="'Room ' + ${r.roomNumber} + ' [' + ${r.roomType} + ' - ' + ${r.availableBeds} + ' beds left] (₹' + ${r.rentPerMonth} + '/mo)'">Room A-101</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{roomId}"></div>
                        </div>

                        <!-- Bed Number -->
                        <div class="col-md-6">
                            <label for="bedNumber" class="form-label">Assign Bed Label / Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{bedNumber}" id="bedNumber" placeholder="e.g. Bed-1, B2" th:classappend="${#fields.hasErrors('bedNumber')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{bedNumber}"></div>
                        </div>

                        <!-- Remarks -->
                        <div class="col-md-6">
                            <label for="remarks" class="form-label">Remarks / Warden Notes</label>
                            <input type="text" class="form-control" th:field="*{remarks}" id="remarks" placeholder="Allocated directly by Warden">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/warden/allocations}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            <i class="bi bi-key-fill me-1"></i> Allocate Bed
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
