<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Notice Management')}">
    <title>Notice Management - Smart PG &amp; Hostel</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('notices')}"></div>

    <main class="app-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Official Notices &amp; Broadcasts</h3>
                <p class="text-muted small mb-0">Publish hostel announcements, event alerts, and maintenance circulars</p>
            </div>
            <a th:href="@{/warden/notices/new}" class="btn btn-primary btn-sm fw-semibold shadow-sm">
                <i class="bi bi-plus-circle me-1"></i> Post New Notice
            </a>
        </div>

        <div class="row g-4">
            <div th:each="n : ${notices}" class="col-md-6 col-xl-4">
                <div class="card card-custom h-100 position-relative">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <span class="badge"
                              th:classappend="${n.priority.name() == 'HIGH' ? 'bg-danger' : (n.priority.name() == 'MEDIUM' ? 'bg-warning text-dark' : 'bg-primary')}"
                              th:text="${n.priority}">HIGH</span>
                        <span class="badge bg-light text-secondary border small" th:text="${n.targetAudience}">ALL</span>
                    </div>
                    <div class="card-body">
                        <h5 class="fw-bold text-dark mb-2" th:text="${n.title}">Notice Title</h5>
                        <p class="text-muted small mb-3" style="min-height: 60px;" th:text="${n.content}">Notice content description</p>
                        <div class="d-flex justify-content-between align-items-center text-muted small border-top pt-2">
                            <span><i class="bi bi-clock me-1"></i> <span th:text="${#temporals.format(n.createdAt, 'dd-MMM-yyyy')}">05-Oct</span></span>
                            <span th:if="${n.expiryDate != null}">Exp: <span th:text="${n.expiryDate}">-</span></span>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 pt-0 pb-3 px-3 d-flex justify-content-end gap-2">
                        <a th:href="@{/warden/notices/edit/{id}(id=${n.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil-square me-1"></i> Edit
                        </a>
                        <form th:action="@{/warden/notices/delete/{id}(id=${n.id})}" method="post" class="m-0"
                              onsubmit="return confirm('Are you sure you want to delete this notice?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(notices)}" class="col-12 text-center py-5 text-muted">
                <i class="bi bi-megaphone fs-1 text-secondary d-block mb-2"></i>
                No active announcements found. Click "Post New Notice" to create one.
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
