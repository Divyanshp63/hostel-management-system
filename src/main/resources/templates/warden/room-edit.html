<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Edit Room')}">
    <title>Edit Room - Smart PG &amp; Hostel</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('rooms')}"></div>

    <main class="app-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Edit Room: <span th:text="${roomNumber}">A-101</span></h3>
                <p class="text-muted small mb-0">Currently occupied beds: <span class="fw-bold text-primary" th:text="${occupied}">0</span></p>
            </div>
            <a th:href="@{/warden/rooms}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Rooms
            </a>
        </div>

        <div class="card card-custom">
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/warden/rooms/update/{id}(id=${roomId})}" th:object="${room}" method="post">
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="floor" class="form-label">Floor Number <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" th:field="*{floor}" id="floor" min="0" th:classappend="${#fields.hasErrors('floor')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{floor}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="roomType" class="form-label">Room Type <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{roomType}" id="roomType">
                                <option th:each="t : ${roomTypes}" th:value="${t}" th:text="${t}">SINGLE</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="capacity" class="form-label">Total Capacity <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" th:field="*{capacity}" id="capacity" th:min="${occupied}" th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{capacity}"></div>
                            <small class="text-muted">Must be at least current occupancy (<span th:text="${occupied}">0</span>)</small>
                        </div>

                        <div class="col-md-6">
                            <label for="rentPerMonth" class="form-label">Monthly Rent (₹) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">₹</span>
                                <input type="number" step="0.01" class="form-control" th:field="*{rentPerMonth}" id="rentPerMonth" th:classappend="${#fields.hasErrors('rentPerMonth')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:errors="*{rentPerMonth}"></div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="status" class="form-label">Room Status <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{status}" id="status">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}">AVAILABLE</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="description" class="form-label">Amenities / Notes</label>
                            <textarea class="form-control" th:field="*{description}" id="description" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/warden/rooms}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            <i class="bi bi-save me-1"></i> Update Room Details
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
