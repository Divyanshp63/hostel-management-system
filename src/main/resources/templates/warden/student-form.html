<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Add Student')}">
    <title>Add Student - Smart PG &amp; Hostel</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('students')}"></div>

    <main class="app-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Add New Student</h3>
                <p class="text-muted small mb-0">Create resident profile and automatic login credentials</p>
            </div>
            <a th:href="@{/warden/students}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Students
            </a>
        </div>

        <div class="card card-custom">
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/warden/students/save}" th:object="${student}" method="post">
                    <!-- Login Credentials Section -->
                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
                        <i class="bi bi-shield-lock me-2"></i> User Login Credentials
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" id="name" placeholder="Full legal name" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">Email Address (Login Username) <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="student@hostel.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="password" class="form-label">Account Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" th:field="*{password}" id="password" placeholder="At least 6 characters" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label">10-Digit Mobile Phone <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{phone}" id="phone" placeholder="9876543210" maxlength="10" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>
                    </div>

                    <!-- Academic & Profile Section -->
                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
                        <i class="bi bi-mortarboard me-2"></i> Academic &amp; Personal Info
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="admissionNumber" class="form-label">Admission Number / Roll No <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{admissionNumber}" id="admissionNumber" placeholder="HOSTEL-2026-0005" th:classappend="${#fields.hasErrors('admissionNumber')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{admissionNumber}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="course" class="form-label">Course / Degree <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{course}" id="course" placeholder="B.Tech Computer Science" th:classappend="${#fields.hasErrors('course')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{course}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="yearOfStudy" class="form-label">Year of Study <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{yearOfStudy}" id="yearOfStudy" placeholder="3rd Year" th:classappend="${#fields.hasErrors('yearOfStudy')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{yearOfStudy}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{gender}" id="gender" th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid' : ''">
                                <option value="">Select Gender</option>
                                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}">MALE</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{gender}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="dateOfBirth" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" th:field="*{dateOfBirth}" id="dateOfBirth">
                        </div>

                        <div class="col-md-4">
                            <label for="bloodGroup" class="form-label">Blood Group</label>
                            <input type="text" class="form-control" th:field="*{bloodGroup}" id="bloodGroup" placeholder="e.g. O+, A+, B+">
                        </div>

                        <div class="col-12">
                            <label for="address" class="form-label">Permanent Address <span class="text-danger">*</span></label>
                            <textarea class="form-control" th:field="*{address}" id="address" rows="2" placeholder="Street, City, State, PIN" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:errors="*{address}"></div>
                        </div>
                    </div>

                    <!-- Guardian Details -->
                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
                        <i class="bi bi-people me-2"></i> Guardian &amp; Emergency Contact
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="guardianName" class="form-label">Guardian Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{guardianName}" id="guardianName" placeholder="Father / Mother / Guardian" th:classappend="${#fields.hasErrors('guardianName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{guardianName}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="guardianPhone" class="form-label">Guardian Phone <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{guardianPhone}" id="guardianPhone" placeholder="10-digit number" maxlength="10" th:classappend="${#fields.hasErrors('guardianPhone')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{guardianPhone}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="emergencyContact" class="form-label">Emergency Contact Phone <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{emergencyContact}" id="emergencyContact" placeholder="10-digit number" maxlength="10" th:classappend="${#fields.hasErrors('emergencyContact')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{emergencyContact}"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/warden/students}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            <i class="bi bi-check-circle-fill me-1"></i> Save Student Profile
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
