<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Edit Mess Menu')}">
    <title>Edit Mess Menu - Smart PG &amp; Hostel</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('mess')}"></div>

    <main class="app-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Edit Mess Timetable</h3>
                <p class="text-muted small mb-0">Updating: <span class="fw-bold text-primary" th:text="${menu.dayOfWeek} + ' ' + ${menu.mealType}">MONDAY BREAKFAST</span></p>
            </div>
            <a th:href="@{/warden/mess}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Mess
            </a>
        </div>

        <div class="card card-custom">
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/warden/mess/update/{id}(id=${menuId})}" th:object="${menu}" method="post">
                    <input type="hidden" th:field="*{dayOfWeek}">
                    <input type="hidden" th:field="*{mealType}">

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Day of Week</label>
                            <input type="text" class="form-control bg-light" th:value="*{dayOfWeek}" readonly>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Meal Type</label>
                            <input type="text" class="form-control bg-light" th:value="*{mealType}" readonly>
                        </div>

                        <div class="col-md-6">
                            <label for="timing" class="form-label">Serving Hours / Timing</label>
                            <input type="text" class="form-control" th:field="*{timing}" id="timing" placeholder="e.g. 08:00 AM - 09:30 AM">
                        </div>

                        <div class="col-md-6">
                            <label for="specialDiet" class="form-label">Special Diet / Extra Items</label>
                            <input type="text" class="form-control" th:field="*{specialDiet}" id="specialDiet" placeholder="e.g. Boiled eggs available on demand">
                        </div>

                        <div class="col-12">
                            <label for="items" class="form-label">Menu Items (Comma Separated) <span class="text-danger">*</span></label>
                            <textarea class="form-control" th:field="*{items}" id="items" rows="3" placeholder="e.g. Dal Tadka, Mix Veg Sabzi, Jeera Rice, Phulka, Boondi Raita, Salad" th:classappend="${#fields.hasErrors('items')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:errors="*{items}"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/warden/mess}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            <i class="bi bi-save me-1"></i> Save Menu Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
