<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Post Notice')}">
    <title>Post Notice - Smart PG &amp; Hostel</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('notices')}"></div>

    <main class="app-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Post Official Notice</h3>
                <p class="text-muted small mb-0">Broadcast an announcement to residents and hostel staff</p>
            </div>
            <a th:href="@{/warden/notices}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Notices
            </a>
        </div>

        <div class="card card-custom">
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/warden/notices/save}" th:object="${notice}" method="post">
                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <label for="title" class="form-label">Notice Headline / Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{title}" id="title" placeholder="e.g. Scheduled Wi-Fi Maintenance & Upgrades" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="priority" class="form-label">Priority Level <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{priority}" id="priority">
                                <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}">HIGH</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="targetAudience" class="form-label">Target Audience <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{targetAudience}" id="targetAudience">
                                <option th:each="t : ${targets}" th:value="${t}" th:text="${t}">ALL</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="expiryDate" class="form-label">Expiry Date</label>
                            <input type="date" class="form-control" th:field="*{expiryDate}" id="expiryDate">
                        </div>

                        <div class="col-12">
                            <label for="content" class="form-label">Detailed Notice Content <span class="text-danger">*</span></label>
                            <textarea class="form-control" th:field="*{content}" id="content" rows="4" placeholder="Enter complete announcement text..." th:classappend="${#fields.hasErrors('content')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:errors="*{content}"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/warden/notices}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            <i class="bi bi-megaphone-fill me-1"></i> Publish Notice
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
