<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Mess Timetable')}">
    <title>Mess Timetable - Smart PG &amp; Hostel</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('mess')}"></div>

    <main class="app-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Hostel Mess Weekly Food Menu</h3>
                <p class="text-muted small mb-0">7-Day nutritional schedule &bull; Breakfast, Lunch, Evening Snacks &amp; Dinner</p>
            </div>
        </div>

        <div class="row g-4">
            <div th:each="entry : ${weekly.weeklySchedule}" class="col-12">
                <div class="card card-custom">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <span class="fw-bold fs-6 text-primary">
                            <i class="bi bi-calendar3 me-2"></i> <span th:text="${entry.key}">MONDAY</span>
                        </span>
                        <span class="badge bg-white text-dark border small" th:text="${#lists.size(entry.value)} + ' Meals'">4 Meals</span>
                    </div>
                    <div class="card-body p-3">
                        <div class="row g-3">
                            <div th:each="m : ${entry.value}" class="col-md-6 col-xl-3">
                                <div class="border rounded-3 p-3 h-100 bg-white d-flex flex-column shadow-sm">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <span class="badge"
                                              th:classappend="${m.mealType.name() == 'BREAKFAST' ? 'bg-warning text-dark' : (m.mealType.name() == 'LUNCH' ? 'bg-primary' : (m.mealType.name() == 'SNACKS' ? 'bg-info text-dark' : 'bg-dark'))}"
                                              th:text="${m.mealType}">
                                            BREAKFAST
                                        </span>
                                        <span class="text-muted small"><i class="bi bi-clock me-1"></i><span th:text="${m.timing != null ? m.timing : 'Regular'}">08:00 AM</span></span>
                                    </div>
                                    <div class="fw-medium text-dark small flex-grow-1" th:text="${m.items}">
                                        Poha, Jalebi, Tea/Coffee
                                    </div>
                                    <div th:if="${m.specialDiet != null}" class="text-success small border-top pt-2 mt-2">
                                        <i class="bi bi-info-circle me-1"></i><span th:text="${m.specialDiet}">Special Diet</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
