<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container-fluid px-3 px-lg-4">
        <!-- Sidebar Toggle for Mobile -->
        <button class="btn btn-sm btn-outline-secondary d-lg-none me-2" type="button" id="sidebarToggle">
            <i class="bi bi-list fs-5"></i>
        </button>

        <!-- Brand -->
        <a class="brand-logo text-decoration-none" th:href="@{/}">
            <i class="bi bi-buildings-fill"></i>
            <span>Smart PG &amp; Hostel</span>
        </a>

        <!-- Right Side: Theme Toggle, User info & Logout -->
        <div class="d-flex align-items-center gap-2 gap-md-3 ms-auto">
            <!-- Global Theme Toggle Button -->
            <button class="btn btn-sm btn-outline-secondary theme-toggle-btn shadow-sm" type="button" id="themeToggleBtn" title="Toggle Theme" aria-label="Toggle Theme">
                <i class="bi bi-moon-stars-fill theme-icon"></i>
                <span class="d-none d-sm-inline theme-text">🌙 Dark Mode</span>
            </button>

            <!-- User Badge -->
            <div class="d-none d-sm-flex flex-column text-end">
                <span class="fw-semibold text-dark small" th:text="${currentUserName != null ? currentUserName : 'Hostel User'}">User Name</span>
                <span class="badge badge-role"
                      th:classappend="${currentUserRole == 'WARDEN' ? 'bg-primary' : (currentUserRole == 'ACCOUNTANT' ? 'bg-warning text-dark' : (currentUserRole == 'COMPLAINT_STAFF' ? 'bg-info text-dark' : 'bg-success'))}"
                      th:text="${currentUserRole != null ? currentUserRole : 'GUEST'}">
                    ROLE
                </span>
            </div>

            <!-- Profile & Logout Dropdown -->
            <div class="dropdown">
                <button class="btn btn-light rounded-circle p-2 shadow-sm border" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle fs-5 text-secondary"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                    <li class="px-3 py-2 border-bottom">
                        <div class="fw-bold" th:text="${currentUserName}">User Name</div>
                        <div class="text-muted small" th:text="${currentUserEmail}">user@hostel.com</div>
                    </li>
                    <li th:if="${currentUserRole == 'STUDENT'}">
                        <a class="dropdown-item py-2" th:href="@{/student/profile}">
                            <i class="bi bi-person me-2 text-primary"></i> My Profile
                        </a>
                    </li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item py-2 text-danger">
                                <i class="bi bi-box-arrow-right me-2"></i> Logout
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
</html>
