<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Registration')}">
    <title>Registration - Smart PG &amp; Hostel</title>
</head>
<body class="bg-light py-5 position-relative">

<!-- Theme toggle top right -->
<div class="position-absolute top-0 end-0 p-3">
    <button class="btn btn-sm btn-outline-secondary theme-toggle-btn shadow-sm" type="button" id="regThemeToggleBtn" title="Toggle Theme" aria-label="Toggle Theme">
        <i class="bi bi-moon-stars-fill theme-icon"></i>
        <span class="theme-text">🌙 Dark Mode</span>
    </button>
</div>

<div class="container" style="max-width: 820px;">
    <!-- Brand -->
    <div class="text-center mb-4">
        <a th:href="@{/login}" class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle p-3 shadow-sm mb-3 text-decoration-none">
            <i class="bi bi-buildings-fill fs-2"></i>
        </a>
        <h3 class="fw-bold text-dark">Create Account</h3>
        <p class="text-muted small">Select your role and complete registration</p>
    </div>

    <!-- Registration Card -->
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5">
            <!-- Flash Alerts -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <form th:action="@{/register}" th:object="${registration}" method="post" id="registrationForm">
                <!-- 1. Common Credentials -->
                <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
                    <i class="bi bi-person-circle me-2"></i> Basic Information
                </h5>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="name" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{name}" id="name" placeholder="" required th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="" required th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-semibold small">Mobile Number <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{phone}" id="phone" placeholder="" maxlength="10" required th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="roleSelect" class="form-label fw-semibold small">Role <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{role}" id="roleSelect" required onchange="handleRoleChange()" th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''">
                            <option value="">-- Select Role --</option>
                            <option value="STUDENT">Student</option>
                            <option value="WARDEN">Warden</option>
                            <option value="ACCOUNTANT">Accountant</option>
                            <option value="COMPLAINT_STAFF">Complaint Department Staff</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{role}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="password" class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" th:field="*{password}" id="password" placeholder="" required minlength="6" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="confirmPassword" class="form-label fw-semibold small">Confirm Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" th:field="*{confirmPassword}" id="confirmPassword" placeholder="" required minlength="6" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                    </div>
                </div>

                <!-- 2. STUDENT SPECIFIC SECTION -->
                <div id="studentSection" style="display: none;">
                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
                        <i class="bi bi-mortarboard me-2"></i> Student Academic Details
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="gender" class="form-label fw-semibold small">Gender <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{gender}" id="gender">
                                <option value="">Select Gender</option>
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="dateOfBirth" class="form-label fw-semibold small">Date of Birth</label>
                            <input type="date" class="form-control" th:field="*{dateOfBirth}" id="dateOfBirth">
                        </div>
                        <div class="col-md-4">
                            <label for="college" class="form-label fw-semibold small">College / University <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{college}" id="college" placeholder="">
                        </div>
                        <div class="col-md-4">
                            <label for="course" class="form-label fw-semibold small">Course <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{course}" id="course" placeholder="">
                        </div>
                        <div class="col-md-4">
                            <label for="semester" class="form-label fw-semibold small">Semester / Year <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{semester}" id="semester" placeholder="">
                        </div>
                        <div class="col-md-4">
                            <label for="admissionNumber" class="form-label fw-semibold small">Admission / Roll No</label>
                            <input type="text" class="form-control" th:field="*{admissionNumber}" id="admissionNumber" placeholder="">
                        </div>
                    </div>

                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
                        <i class="bi bi-door-open me-2"></i> Hostel &amp; Room Details
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-3">
                            <label for="hostelName" class="form-label fw-semibold small">Hostel Name / ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{hostelName}" id="hostelName" placeholder="">
                        </div>
                        <div class="col-md-3">
                            <label for="hostelBlock" class="form-label fw-semibold small">Hostel Block <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{hostelBlock}" id="hostelBlock" placeholder="">
                        </div>
                        <div class="col-md-3">
                            <label for="roomNumber" class="form-label fw-semibold small">Room Number <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{roomNumber}" id="roomNumber">
                                <option value="">Select Room</option>
                                <option th:each="r : ${availableRooms}"
                                        th:value="${r.roomNumber}"
                                        th:text="${r.roomNumber + ' (' + r.blockName + ', ' + r.roomType + ' - ' + r.availableBeds + ' beds left)'}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="bedNumber" class="form-label fw-semibold small">Bed Number <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{bedNumber}" id="bedNumber">
                                <option value="">Select Bed</option>
                                <option value="Bed 1">Bed 1</option>
                                <option value="Bed 2">Bed 2</option>
                                <option value="Bed 3">Bed 3</option>
                                <option value="Bed 4">Bed 4</option>
                            </select>
                        </div>
                    </div>

                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
                        <i class="bi bi-people me-2"></i> Guardian &amp; Emergency Details
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="guardianName" class="form-label fw-semibold small">Guardian Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{guardianName}" id="guardianName" placeholder="">
                        </div>
                        <div class="col-md-4">
                            <label for="guardianPhone" class="form-label fw-semibold small">Guardian Mobile <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{guardianPhone}" id="guardianPhone" maxlength="10" placeholder="">
                        </div>
                        <div class="col-md-4">
                            <label for="emergencyContact" class="form-label fw-semibold small">Emergency Contact <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{emergencyContact}" id="emergencyContact" maxlength="10" placeholder="">
                        </div>
                        <div class="col-12">
                            <label for="permanentAddress" class="form-label fw-semibold small">Permanent Address <span class="text-danger">*</span></label>
                            <textarea class="form-control" th:field="*{permanentAddress}" id="permanentAddress" rows="2" placeholder=""></textarea>
                        </div>
                    </div>
                </div>

                <!-- 3. WARDEN SPECIFIC SECTION -->
                <div id="wardenSection" style="display: none;">
                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
                        <i class="bi bi-shield-check me-2"></i> Warden Profile Details
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="wardenEmployeeId" class="form-label fw-semibold small">Employee ID</label>
                            <input type="text" class="form-control" th:field="*{employeeId}" id="wardenEmployeeId" placeholder="">
                        </div>
                        <div class="col-md-6">
                            <label for="hostelAssignment" class="form-label fw-semibold small">Hostel Assignment</label>
                            <input type="text" class="form-control" th:field="*{hostelAssignment}" id="hostelAssignment" placeholder="">
                        </div>
                    </div>
                </div>

                <!-- 4. ACCOUNTANT SPECIFIC SECTION -->
                <div id="accountantSection" style="display: none;">
                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
                        <i class="bi bi-cash-coin me-2"></i> Accountant Profile Details
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="accountantEmployeeId" class="form-label fw-semibold small">Employee ID</label>
                            <input type="text" class="form-control" id="accountantEmployeeId" name="employeeId" placeholder="">
                        </div>
                    </div>
                </div>

                <!-- 5. COMPLAINT DEPARTMENT STAFF SPECIFIC SECTION -->
                <div id="complaintStaffSection" style="display: none;">
                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
                        <i class="bi bi-tools me-2"></i> Complaint Department Staff Details
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="staffEmployeeId" class="form-label fw-semibold small">Employee ID</label>
                            <input type="text" class="form-control" id="staffEmployeeId" name="employeeId" placeholder="">
                        </div>
                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold small">Assigned Department <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{department}" id="department">
                                <option value="">-- Select Department --</option>
                                <option value="ELECTRICAL">Electrical</option>
                                <option value="PLUMBING">Plumbing</option>
                                <option value="HOUSEKEEPING">Housekeeping</option>
                                <option value="INTERNET_IT">Internet / IT</option>
                                <option value="MAINTENANCE">Maintenance</option>
                                <option value="MESS">Mess</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Submission Buttons -->
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold shadow-sm">
                        <i class="bi bi-check-circle-fill me-1"></i> Register Account
                    </button>
                    <a th:href="@{/login}" class="btn btn-light py-2 text-secondary">
                        Already have an account? Sign in
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function handleRoleChange() {
        const role = document.getElementById('roleSelect').value;
        const studentSec = document.getElementById('studentSection');
        const wardenSec = document.getElementById('wardenSection');
        const accountantSec = document.getElementById('accountantSection');
        const staffSec = document.getElementById('complaintStaffSection');

        // Hide all
        studentSec.style.display = 'none';
        wardenSec.style.display = 'none';
        accountantSec.style.display = 'none';
        staffSec.style.display = 'none';

        // Toggle selected
        if (role === 'STUDENT') {
            studentSec.style.display = 'block';
        } else if (role === 'WARDEN') {
            wardenSec.style.display = 'block';
        } else if (role === 'ACCOUNTANT') {
            accountantSec.style.display = 'block';
        } else if (role === 'COMPLAINT_STAFF') {
            staffSec.style.display = 'block';
        }
    }

    // Trigger on page load to handle validation errors re-rendering
    document.addEventListener('DOMContentLoaded', function() {
        handleRoleChange();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
