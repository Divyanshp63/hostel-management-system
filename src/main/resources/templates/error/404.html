<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('404 - Page Not Found')}">
    <title>404 - Page Not Found</title>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5 position-relative">

<div class="position-absolute top-0 end-0 p-3">
    <button class="btn btn-sm btn-outline-secondary theme-toggle-btn shadow-sm" type="button" title="Toggle Theme" aria-label="Toggle Theme">
        <i class="bi bi-moon-stars-fill theme-icon"></i>
        <span class="theme-text">🌙 Dark Mode</span>
    </button>
</div>

<div class="container text-center" style="max-width: 520px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <div class="mb-3 text-primary">
            <span class="fw-bold" style="font-size: 5rem; line-height: 1;">404</span>
        </div>
        <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
        <p class="text-muted mb-4">
            The page you are looking for doesn't exist, has been removed, or was relocated.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-primary px-4 fw-semibold shadow-sm">
                <i class="bi bi-speedometer2 me-1"></i> Back to Dashboard
            </a>
            <a th:href="@{/login}" class="btn btn-outline-secondary px-4 fw-semibold">
                <i class="bi bi-house-door-fill me-1"></i> Go Home
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
