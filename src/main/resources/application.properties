# Server Configuration (Port 2007)
server.port=${PORT:2007}
server.address=0.0.0.0

# Application Name
spring.application.name=hostel-management

# Database Configuration with Local Fallbacks
# Render par ye DB_URL, DB_USERNAME, DB_PASSWORD environment variables uthayega.
# Local machine par bina kisi setup ke localhost:3306 connect karega.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_hostel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Enabled for Thymeleaf rendering of entity relationships
spring.jpa.open-in-view=true

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Session Management Configuration
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=SMART_HOSTEL_SESSION

# JWT Security Configuration (Retained for REST API compatibility)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.hostel.management=INFO
logging.level.org.springframework.security=WARN
